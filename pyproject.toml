[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parking-reservation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "filelock>=3.16.0",
    "gdown>=5.2.1",
    "httpx>=0.28.1",
    "langchain>=1.2.8",
    "langchain-google-genai>=4.2.0",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-ollama>=1.0.0",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.6",
    "litellm>=1.81.1",
    "llama-index>=0.14.12",
    "llama-index-embeddings-gemini>=0.4.1",
    "llama-index-embeddings-google-genai>=0.3.1",
    "llama-index-llms-ollama>=0.8.4",
    "llama-index-vector-stores-mongodb>=0.9.1",
    "llama-index-vector-stores-postgres>=0.7.2",
    "matplotlib>=3.10.8",
    "mcp>=1.26.0",
    "nest-asyncio>=1.6.0",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.45",
    "streamlit>=1.28.0",
    "tiktoken>=0.12.0",
    "ragas>=0.2.0",
    "datasets>=2.14.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
